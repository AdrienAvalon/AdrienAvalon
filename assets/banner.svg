    <path d="m864 210 80-134 80 134M899 158h90" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M788 150h71m174 0h81M944 39v-17m0 222v34" stroke-width="1.5" opacity="0.45"/>
    <path d="m824 75 42 24m155 99 56 31m-1-154-56 31m-157 92-44 25" stroke-width="1" opacity="0.2"/>
    <circle cx="944" cy="151" r="116" stroke-width="1" opacity="0.12"/>
  </g>
  <g fill="#91e3c8">
    <circle cx="788" cy="150" r="4"/>
    <circle cx="1114" cy="150" r="4"/>
    <circle cx="944" cy="39" r="4"/>
